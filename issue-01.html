<script>
  lucide.createIcons();

  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  revealEls.forEach(el => io.observe(el));

  // ===== View & Like counters (FastAPI + MongoDB backend) =====
  (function initCounters() {
    const API_BASE = 'https://portfolio-backend-ychi.onrender.com';
    const LIKED_FLAG_KEY = 'issue-01-liked';

    const viewEl = document.getElementById('view-count');
    const likeBtn = document.getElementById('like-btn');
    const likeCountEl = document.getElementById('like-count');

    function setLikedState() {
      likeBtn.classList.add('text-emerald-400', 'border-emerald-400/50');
      likeBtn.disabled = true;
      likeBtn.style.cursor = 'default';
    }

    // Record a view, then show the current like count.
    fetch(`${API_BASE}/api/view`, { method: 'POST' })
      .then(res => { if (!res.ok) throw new Error('bad response'); return res.json(); })
      .then(data => { viewEl.textContent = data.views.toLocaleString(); })
      .catch(() => { viewEl.textContent = '—'; });

    fetch(`${API_BASE}/api/stats`)
      .then(res => { if (!res.ok) throw new Error('bad response'); return res.json(); })
      .then(data => { likeCountEl.textContent = data.likes.toLocaleString(); })
      .catch(() => { likeCountEl.textContent = '—'; });

    if (localStorage.getItem(LIKED_FLAG_KEY) === 'true') setLikedState();

    likeBtn.addEventListener('click', () => {
      if (localStorage.getItem(LIKED_FLAG_KEY) === 'true') return;
      setLikedState();

      fetch(`${API_BASE}/api/like`, { method: 'POST' })
        .then(res => { if (!res.ok) throw new Error('bad response'); return res.json(); })
        .then(data => {
          localStorage.setItem(LIKED_FLAG_KEY, 'true');
          likeCountEl.textContent = data.likes.toLocaleString();
        })
        .catch(() => {
          localStorage.setItem(LIKED_FLAG_KEY, 'true');
        });
    });
  })();
</script>
